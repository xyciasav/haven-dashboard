services:
  haven:
    image: haven-dashboard:0.4.0
    build:
      context: .
      args:
        HAVEN_VERSION: 0.4.0
    container_name: haven
    restart: unless-stopped
    ports:
      - "43127:3000"
    environment:
      HAVEN_USER_NAME: Mike
      HAVEN_SETUP_TOKEN: ${HAVEN_SETUP_TOKEN:-}
      HAVEN_AUTH_BYPASS: ${HAVEN_AUTH_BYPASS:-false}
      KEYCLOAK_ENABLED: "false"
      KEYCLOAK_URL: ""
      KEYCLOAK_REALM: ""
      KEYCLOAK_CLIENT_ID: haven
      HOME_ASSISTANT_URL: ${HOME_ASSISTANT_URL:-}
      HOME_ASSISTANT_TOKEN: ${HOME_ASSISTANT_TOKEN:-}
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - haven-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  haven-data:
