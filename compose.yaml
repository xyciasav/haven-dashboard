services:
  haven:
    build:
      context: .
    image: haven-dashboard:latest
    container_name: haven
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      HAVEN_USER_NAME: Mike
      KEYCLOAK_ENABLED: "false"
      KEYCLOAK_URL: https://auth.example.com
      KEYCLOAK_REALM: home
      KEYCLOAK_CLIENT_ID: haven
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /usr/share/nginx/html
      - /var/cache/nginx
      - /var/run
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
