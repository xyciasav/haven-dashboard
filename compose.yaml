services:
  haven:
    build:
      context: .
    image: haven-dashboard:latest
    container_name: haven
    restart: unless-stopped
    ports:
      - "43127:3000"
    environment:
      HAVEN_USER_NAME: Mike
      KEYCLOAK_ENABLED: "false"
      KEYCLOAK_URL: https://auth.example.com
      KEYCLOAK_REALM: home
      KEYCLOAK_CLIENT_ID: haven
      HOME_ASSISTANT_URL: ""
      HOME_ASSISTANT_TOKEN: ""
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /app/public
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
